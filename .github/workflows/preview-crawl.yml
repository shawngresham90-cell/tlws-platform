name: preview-crawl

# Authoritative internal-link crawl against the Netlify deploy preview.
# The development sandbox cannot reach *.netlify.app, so the crawl of
# DB-backed routes (e.g. /knowledge/<category>) runs here instead.
#
# Dispatch-only: the crawl needs a deploy-preview URL, which exists per pull
# request. There used to be a `push` trigger pinned to one long-finished
# branch, and `base_url` defaulted to the preview for PR #161 — dispatching
# without an explicit URL crawled a stale, unrelated deploy and reported a
# meaningless pass. The input is required now, with no default to fall back on.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deploy-preview URL to crawl (e.g. https://deploy-preview-<n>--<site>.netlify.app)'
        required: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for preview to serve this commit
        run: |
          URL="${{ github.event.inputs.base_url }}"
          case "$URL" in
            https://*) ;;
            *) echo "base_url must be an https URL, got: $URL"; exit 1 ;;
          esac
          echo "BASE_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "preview never returned 200"; exit 1
      - name: Crawl internal links
        run: node scripts/crawl-links.mjs "$BASE_URL"
